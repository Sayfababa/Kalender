<title>Die Tageszeitung</title>
<meta name="claude:viewport-fit-sides" content="cover">
<meta name="apple-mobile-web-app-capable" content="yes">
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=UnifrakturMaguntia&family=Old+Standard+TT:ital,wght@0,400;0,700;1,400&family=Source+Serif+4:ital,opsz,wght@0,8..60,400;0,8..60,600;1,8..60,400&display=swap">
<style>
/* Layout: Zeitungsseite – Masthead, Datumszeile, zwei Spalten (Aufgaben | Kalender), Notizen unten */
:root{
  --paper:#f7f5ef; --ink:#151412; --ink-soft:#4a4740; --rule:#1c1b18; --faint:#d9d5c9; --red:#8f1d16;
  --display:"UnifrakturMaguntia","Old English Text MT",serif;
  --head:"Old Standard TT",Georgia,serif;
  --body:"Source Serif 4",Georgia,serif;
  color-scheme:light;
}
@media (prefers-color-scheme: dark){:root:not([data-theme="light"]){--paper:#1a1916;--ink:#ece8dd;--ink-soft:#a8a397;--rule:#ece8dd;--faint:#3a3832;--red:#e0796f;color-scheme:dark}}
:root[data-theme="dark"]{--paper:#1a1916;--ink:#ece8dd;--ink-soft:#a8a397;--rule:#ece8dd;--faint:#3a3832;--red:#e0796f;color-scheme:dark}
body{background:var(--paper);color:var(--ink);font-family:var(--body);font-size:16px;line-height:1.5;
  padding-left:max(16px,env(safe-area-inset-left,0px));padding-right:max(16px,env(safe-area-inset-right,0px));padding-block:20px 40px}
.page{max-width:1000px;margin:0 auto}
header{text-align:center;border-bottom:3px double var(--rule);padding-bottom:10px}
.ear{display:flex;justify-content:space-between;gap:12px;font:italic 13px var(--head);color:var(--ink-soft)}
h1{font-family:var(--display);font-weight:400;font-size:clamp(40px,11vw,84px);line-height:1.05;margin:6px 0 4px}
.dateline{display:flex;justify-content:space-between;flex-wrap:wrap;gap:6px;border-top:1px solid var(--rule);border-bottom:1px solid var(--rule);
  padding:5px 0;font:12px var(--head);text-transform:uppercase;letter-spacing:.08em;font-variant-numeric:tabular-nums}
.headline{text-align:center;padding:18px 0 14px;border-bottom:1px solid var(--rule)}
.headline h2{font:700 clamp(24px,5vw,38px)/1.15 var(--head);margin:0;text-wrap:balance}
.headline p{margin:6px 0 0;font-style:italic;color:var(--ink-soft)}
.cols{display:grid;grid-template-columns:1fr 1fr;gap:0}
.cols>section{padding:16px 0;min-width:0}
.cols>section:first-child{padding-right:20px;border-right:1px solid var(--rule)}
.cols>section:last-child{padding-left:20px}
@media (max-width:700px){.cols{grid-template-columns:1fr}.cols>section:first-child{padding-right:0;border-right:0;border-bottom:1px solid var(--rule)}.cols>section:last-child{padding-left:0}}
.kicker{font:700 12px var(--head);text-transform:uppercase;letter-spacing:.14em;color:var(--red);margin:0}
h3{font:700 24px/1.2 var(--head);margin:2px 0 10px}
form{display:flex;gap:8px;margin-bottom:12px}
input[type=text],input[type=date]{flex:1;min-width:0;font:16px var(--body);color:var(--ink);background:transparent;border:0;border-bottom:1px solid var(--ink-soft);padding:6px 2px}
input:focus-visible,button:focus-visible{outline:2px solid var(--red);outline-offset:2px}
button{font:700 12px var(--head);text-transform:uppercase;letter-spacing:.1em;background:var(--ink);color:var(--paper);border:0;padding:8px 12px;cursor:pointer}
button.link{background:none;color:var(--ink-soft);padding:4px;font-size:16px;letter-spacing:0}
ul{list-style:none;margin:0;padding:0}
.todo li{display:flex;align-items:baseline;gap:10px;padding:8px 0;border-bottom:1px dotted var(--faint)}
.todo li span{flex:1;min-width:0;overflow-wrap:anywhere}
.todo li.done span{text-decoration:line-through;color:var(--ink-soft)}
.todo input[type=checkbox]{accent-color:var(--ink);width:18px;height:18px;flex:none;transform:translateY(3px)}
.empty{font-style:italic;color:var(--ink-soft);padding:8px 0}
.count{font:italic 14px var(--head);color:var(--ink-soft);margin-top:8px}
.calhead{display:flex;justify-content:space-between;align-items:center;margin-bottom:6px}
.calhead strong{font:700 18px var(--head)}
.grid{display:grid;grid-template-columns:repeat(7,1fr);text-align:center;font-variant-numeric:tabular-nums;border-top:1px solid var(--rule)}
.grid .dow{font:700 11px var(--head);text-transform:uppercase;letter-spacing:.08em;padding:6px 0;border-bottom:1px solid var(--faint)}
.grid button.day{background:none;color:var(--ink);font:15px var(--body);letter-spacing:0;padding:8px 0;position:relative}
.grid button.day.other{color:var(--faint)}
.grid button.day.today{font-weight:700;text-decoration:underline;text-underline-offset:4px}
.grid button.day.sel{background:var(--ink);color:var(--paper)}
.grid button.day.has::after{content:"";position:absolute;left:50%;bottom:3px;width:4px;height:4px;margin-left:-2px;border-radius:50%;background:var(--red)}
.events{margin-top:14px}
.events h4{font:italic 16px var(--head);margin:0 0 6px;border-bottom:1px solid var(--faint);padding-bottom:4px}
.events li{display:flex;gap:10px;align-items:baseline;padding:6px 0;border-bottom:1px dotted var(--faint)}
.events li time{font:700 13px var(--head);min-width:44px;font-variant-numeric:tabular-nums}
.events li span{flex:1;min-width:0;overflow-wrap:anywhere}
.notes{border-top:3px double var(--rule);padding-top:16px}
textarea{width:100%;box-sizing:border-box;min-height:140px;font:16px/1.6 var(--body);color:var(--ink);background:transparent;border:1px solid var(--faint);padding:10px;resize:vertical;columns:2}
.quote{font:italic 17px/1.5 var(--head);text-align:center;color:var(--ink-soft);margin:20px auto 0;max-width:60ch}
footer{margin-top:20px;border-top:1px solid var(--rule);padding-top:6px;font:11px var(--head);text-transform:uppercase;letter-spacing:.1em;text-align:center;color:var(--ink-soft)}
</style>

<div class="page">
  <header>
    <div class="ear"><span>„Alles, was heute zählt.“</span><span id="weekno"></span></div>
    <h1>Die Tageszeitung</h1>
    <div class="dateline"><span id="longdate"></span><span>Persönliche Ausgabe</span><span id="clock"></span></div>
  </header>

  <div class="headline">
    <h2 id="headline">Guten Tag</h2>
    <p id="subhead"></p>
  </div>

  <div class="cols">
    <section>
      <p class="kicker">Ressort Erledigungen</p>
      <h3>Aufgaben</h3>
      <form id="todoForm"><input type="text" id="todoInput" placeholder="Neue Aufgabe …" autocomplete="off"><button>Hinzufügen</button></form>
      <ul class="todo" id="todoList"></ul>
      <div class="count" id="todoCount"></div>
    </section>
    <section>
      <p class="kicker">Ressort Termine</p>
      <h3>Kalender</h3>
      <div class="calhead"><button class="link" id="prev" aria-label="Vorheriger Monat">‹</button><strong id="monthLabel"></strong><button class="link" id="next" aria-label="Nächster Monat">›</button></div>
      <div class="grid" id="grid"></div>
      <div class="events">
        <h4 id="selLabel"></h4>
        <ul id="eventList"></ul>
        <form id="eventForm" style="margin-top:10px"><input type="text" id="evTime" placeholder="09:00" style="flex:0 0 64px" inputmode="numeric"><input type="text" id="evText" placeholder="Termin …" autocomplete="off"><button>+</button></form>
      </div>
    </section>
  </div>

  <section class="notes">
    <p class="kicker">Feuilleton</p>
    <h3>Notizen</h3>
    <textarea id="notes" placeholder="Gedanken, Ideen, Einkaufszettel …"></textarea>
    <p class="quote" id="quote"></p>
  </section>

  <footer>Gedruckt auf Ihrem Gerät · Alle Angaben ohne Gewähr</footer>
</div>

<script>
const load=(k,d)=>{try{const v=localStorage.getItem(k);return v?JSON.parse(v):d}catch(e){return d}};
const save=(k,v)=>{try{localStorage.setItem(k,JSON.stringify(v))}catch(e){}};
const esc=s=>s.replace(/[&<>"]/g,c=>({"&":"&amp;","<":"&lt;",">":"&gt;",'"':"&quot;"}[c]));
const key=d=>d.getFullYear()+"-"+String(d.getMonth()+1).padStart(2,"0")+"-"+String(d.getDate()).padStart(2,"0");
const now=new Date(), today=key(now);

let todos=load("todos",[{t:"Beispiel: Zahnarzt anrufen",d:false},{t:"Beispiel: Wocheneinkauf",d:true},{t:"Beispiel: Steuerunterlagen sortieren",d:false}]);
let events=load("events",{[today]:[{h:"18:30",t:"Beispiel: Abendessen mit Freunden"}]});

/* Kopfzeile */
function tick(){const d=new Date();document.getElementById("clock").textContent=d.toLocaleTimeString("de-DE",{hour:"2-digit",minute:"2-digit"})}
tick();setInterval(tick,15000);
document.getElementById("longdate").textContent=now.toLocaleDateString("de-DE",{weekday:"long",day:"numeric",month:"long",year:"numeric"});
const t=new Date(Date.UTC(now.getFullYear(),now.getMonth(),now.getDate()));t.setUTCDate(t.getUTCDate()+4-(t.getUTCDay()||7));
document.getElementById("weekno").textContent="KW "+Math.ceil(((t-Date.UTC(t.getUTCFullYear(),0,1))/864e5+1)/7);
const h=now.getHours();
document.getElementById("headline").textContent=h<11?"Guten Morgen":h<18?"Guten Tag":"Guten Abend";
const quotes=["„Wer immer tut, was er schon kann, bleibt immer das, was er schon ist.“ — Henry Ford","„Der Anfang ist die Hälfte des Ganzen.“ — Aristoteles","„Es ist nicht wenig Zeit, die wir haben, sondern viel Zeit, die wir nicht nutzen.“ — Seneca","„Ordnung ist das halbe Leben.“ — Sprichwort","„Tu erst das Notwendige, dann das Mögliche.“ — Franz von Assisi"];
document.getElementById("quote").textContent=quotes[now.getDate()%quotes.length];

/* Aufgaben */
function renderTodos(){
  const ul=document.getElementById("todoList");
  ul.innerHTML=todos.length?todos.map((x,i)=>`<li class="${x.d?"done":""}"><input type="checkbox" id="td${i}" ${x.d?"checked":""} data-i="${i}"><span>${esc(x.t)}</span><button class="link" data-del="${i}" aria-label="Löschen">×</button></li>`).join(""):`<li class="empty">Keine Aufgaben. Ein ruhiger Tag.</li>`;
  const open=todos.filter(x=>!x.d).length;
  document.getElementById("todoCount").textContent=`${open} offen · ${todos.length-open} erledigt`;
  renderSub();save("todos",todos);
}
document.getElementById("todoList").addEventListener("click",e=>{
  if(e.target.dataset.del!==undefined){todos.splice(+e.target.dataset.del,1);renderTodos()}
  else if(e.target.dataset.i!==undefined){todos[+e.target.dataset.i].d=e.target.checked;renderTodos()}
});
document.getElementById("todoForm").addEventListener("submit",e=>{e.preventDefault();const i=document.getElementById("todoInput");if(i.value.trim()){todos.unshift({t:i.value.trim(),d:false});i.value="";renderTodos()}});

/* Kalender */
let view=new Date(now.getFullYear(),now.getMonth(),1), sel=today;
function renderCal(){
  document.getElementById("monthLabel").textContent=view.toLocaleDateString("de-DE",{month:"long",year:"numeric"});
  const g=document.getElementById("grid");let html=["Mo","Di","Mi","Do","Fr","Sa","So"].map(d=>`<div class="dow">${d}</div>`).join("");
  const start=new Date(view);start.setDate(1-((view.getDay()+6)%7));
  for(let i=0;i<42;i++){const d=new Date(start);d.setDate(start.getDate()+i);const k=key(d);
    const c=["day",d.getMonth()!==view.getMonth()?"other":"",k===today?"today":"",k===sel?"sel":"",(events[k]||[]).length?"has":""].join(" ");
    html+=`<button class="${c}" data-k="${k}">${d.getDate()}</button>`}
  g.innerHTML=html;
  const sd=new Date(sel+"T12:00");
  document.getElementById("selLabel").textContent=(sel===today?"Heute, ":"")+sd.toLocaleDateString("de-DE",{weekday:"long",day:"numeric",month:"long"});
  const ev=(events[sel]||[]).slice().sort((a,b)=>a.h.localeCompare(b.h));
  document.getElementById("eventList").innerHTML=ev.length?ev.map(x=>`<li><time>${esc(x.h||"—")}</time><span>${esc(x.t)}</span><button class="link" data-h="${esc(x.h)}" data-t="${esc(x.t)}" aria-label="Löschen">×</button></li>`).join(""):`<li class="empty">Keine Termine.</li>`;
  renderSub();save("events",events);
}
document.getElementById("grid").addEventListener("click",e=>{const k=e.target.dataset.k;if(k){sel=k;renderCal()}});
document.getElementById("prev").onclick=()=>{view.setMonth(view.getMonth()-1);renderCal()};
document.getElementById("next").onclick=()=>{view.setMonth(view.getMonth()+1);renderCal()};
document.getElementById("eventList").addEventListener("click",e=>{if(e.target.dataset.t!==undefined){events[sel]=(events[sel]||[]).filter(x=>!(x.t===e.target.dataset.t&&x.h===e.target.dataset.h));if(!events[sel].length)delete events[sel];renderCal()}});
document.getElementById("eventForm").addEventListener("submit",e=>{e.preventDefault();const tx=document.getElementById("evText"),tm=document.getElementById("evTime");
  if(tx.value.trim()){(events[sel]=events[sel]||[]).push({h:tm.value.trim(),t:tx.value.trim()});tx.value="";tm.value="";renderCal()}});

function renderSub(){
  const open=todos.filter(x=>!x.d).length, n=(events[today]||[]).length;
  document.getElementById("subhead").textContent=`${open} ${open===1?"Aufgabe wartet":"Aufgaben warten"} · ${n} ${n===1?"Termin":"Termine"} heute`;
}

/* Notizen */
const notes=document.getElementById("notes");notes.value=load("notes","");
notes.addEventListener("input",()=>save("notes",notes.value));

renderTodos();renderCal();
</script>
