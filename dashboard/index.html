<title>Mein Tag</title>
<meta name="claude:viewport-fit-sides" content="cover">
<meta name="apple-mobile-web-app-capable" content="yes">
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Inter:wght@300;600&display=swap">
<style>
/* Layout: ein Bildschirm, eine Spalte – Titel, Woche, Termine, Aufgaben, Notizen; nur Haarlinien, viel Luft */
:root{
  --paper:#f8f7f3; --ink:#1a1917; --soft:#8a867c; --line:#dcd8ce; --accent:#8f1d16;
  --display:"Inter",-apple-system,system-ui,sans-serif;
  --body:"Inter",-apple-system,system-ui,sans-serif;
  color-scheme:light;
}
@media (prefers-color-scheme: dark){:root:not([data-theme="light"]){--paper:#171614;--ink:#ebe7dc;--soft:#8e897e;--line:#34322d;--accent:#d98078;color-scheme:dark}}
:root[data-theme="dark"]{--paper:#171614;--ink:#ebe7dc;--soft:#8e897e;--line:#34322d;--accent:#d98078;color-scheme:dark}
html,body{height:100%}
body{background:var(--paper);color:var(--ink);font:300 16px/1.45 var(--body);box-sizing:border-box;overflow:hidden;
  padding-left:max(22px,env(safe-area-inset-left,0px));padding-right:max(22px,env(safe-area-inset-right,0px));padding-block:14px 14px}
.page{height:100%;max-width:520px;margin:0 auto;display:flex;flex-direction:column;gap:14px}
header{flex:none;text-align:center}
.date{font-size:12px;font-weight:300;letter-spacing:.18em;text-transform:uppercase;color:var(--soft);font-variant-numeric:tabular-nums}
.week{flex:none;display:grid;grid-template-columns:repeat(7,1fr);text-align:center;border-block:1px solid var(--line);padding-block:6px}
.week{row-gap:4px}
.week button{background:none;border:0;border-radius:10px;color:var(--ink);padding:11px 0;cursor:pointer;font:300 18px var(--body);transition:background .15s;font-variant-numeric:tabular-nums;position:relative}
.week .over{background:var(--line);outline:1px solid var(--accent)}
.grip{flex:none;touch-action:none;cursor:grab;color:var(--soft);padding:0 6px 0 0;user-select:none;-webkit-user-select:none;font-size:14px;letter-spacing:-2px}
.ghost{position:fixed;z-index:50;pointer-events:none;transform:translate(-50%,-120%);background:var(--paper);border:1px solid var(--ink);border-radius:8px;padding:6px 12px;font-size:14px;max-width:70vw;white-space:nowrap;overflow:hidden;text-overflow:ellipsis;box-shadow:0 6px 20px rgba(0,0,0,.18)}
.week small{display:block;font-size:10px;letter-spacing:.12em;text-transform:uppercase;color:var(--soft)}
.week .today{color:var(--accent)}
.week .sel{font-weight:300}
.week .sel::before{content:"";position:absolute;left:30%;right:30%;bottom:-7px;border-bottom:1px solid var(--ink)}
.week .has::after{content:"";position:absolute;left:50%;top:2px;width:3px;height:3px;margin-left:10px;border-radius:50%;background:var(--accent)}
section{display:flex;flex-direction:column;min-height:0}
#cal{flex:0 1 auto;max-height:28%}
#tasks{flex:1 1 auto}
#notesSec{flex:0 0 22%}
h2{flex:none;display:flex;justify-content:space-between;align-items:baseline;margin:0 0 4px;font:600 12px var(--display);letter-spacing:.16em;text-transform:uppercase}
h2 span{font:300 12px var(--body);letter-spacing:.04em;text-transform:none;color:var(--soft)}
ul{list-style:none;margin:0;padding:0;overflow-y:auto;min-height:0;flex:1 1 auto}
li{display:flex;align-items:baseline;gap:12px;padding:5px 0}
li span{flex:1;min-width:0;overflow-wrap:anywhere}
li time{font-size:13px;color:var(--soft);min-width:38px;font-variant-numeric:tabular-nums}
li.done span{text-decoration:line-through;text-decoration-color:var(--soft);color:var(--soft)}
.check{flex:none;width:15px;height:15px;border:1px solid var(--ink);border-radius:50%;background:none;padding:0;cursor:pointer;transform:translateY(2px)}
li.done .check{background:var(--ink)}
.x{background:none;border:0;color:var(--soft);font-size:16px;padding:0 2px;cursor:pointer;opacity:.6}
.empty{font-style:italic;color:var(--soft)}
#eventList li{border-bottom:1px solid var(--line);padding:7px 0}
#eventForm{border-bottom:1px solid var(--ink);margin-top:2px}
.cdot{flex:none;width:7px;height:7px;border-radius:50%;transform:translateY(-1px)}
.week .has::after{background:var(--dot)!important}
.pick{flex:none;display:flex;align-items:center;gap:14px;padding:8px 0 2px;font-size:12px;color:var(--soft);letter-spacing:.04em}
.pick span{flex:1}
.pick button{width:22px;height:22px;border-radius:50%;border:0;padding:0;cursor:pointer;box-shadow:0 0 0 2px var(--paper),0 0 0 3px var(--line)}
.tbox{flex:none;position:relative;display:flex;align-items:center;border:1px solid var(--line);border-radius:14px;padding:3px 10px;font-size:13px;color:var(--soft);white-space:nowrap;font-variant-numeric:tabular-nums;cursor:pointer}
.tbox.set{color:var(--ink);border-color:var(--ink)}
.tbox input{position:absolute;inset:0;width:100%;height:100%;opacity:0;border:0;padding:0;margin:0;cursor:pointer;font-size:16px}
input[type=text],textarea{font:300 16px var(--body);color:var(--ink);background:transparent;border:0;outline:0}
form{flex:none;display:flex;gap:10px;border-bottom:1px solid var(--line);padding:4px 0}
form input{flex:1;min-width:0;padding:2px 0}
form input::placeholder,textarea::placeholder{color:var(--soft)}
.add{flex:none;width:28px;height:28px;border:1px solid var(--ink);border-radius:50%;background:none;color:var(--ink);font:300 18px/1 var(--body);cursor:pointer;padding:0}
textarea{flex:1;min-height:0;resize:none;padding:4px 0;line-height:1.5;
  background-image:linear-gradient(transparent calc(1.5em - 1px),var(--line) 0);background-size:100% 1.5em;background-attachment:local}
:focus-visible{outline:1px solid var(--accent);outline-offset:3px}
</style>

<div class="page">
  <header>
    <div class="date" id="date"></div>
  </header>

  <div class="week" id="week"></div>

  <section id="cal">
    <h2>Termine <span id="selLabel"></span></h2>
    <ul id="eventList"></ul>
    <form id="eventForm"><label class="tbox" id="tbox"><span id="tlabel">Uhrzeit</span><input type="time" id="evTime" aria-label="Uhrzeit wählen"></label><input type="text" id="evText" placeholder="Neuer Termin" autocomplete="off"><button class="add" type="submit" aria-label="Termin hinzufügen">+</button></form>
    <div class="pick" id="pick" hidden><span>Farbe wählen</span><button data-c="rot" style="background:#c4453a" aria-label="Rot"></button><button data-c="blau" style="background:#3b6cb4" aria-label="Blau"></button><button data-c="gruen" style="background:#4a8a5a" aria-label="Grün"></button><button data-c="gelb" style="background:#d9a926" aria-label="Gelb"></button></div>
  </section>

  <section id="tasks">
    <h2>Aufgaben <span id="todoCount"></span></h2>
    <ul id="todoList"></ul>
    <form id="todoForm"><input type="text" id="todoInput" placeholder="Neue Aufgabe" autocomplete="off"><button class="add" type="submit" aria-label="Aufgabe hinzufügen">+</button></form>
  </section>

  <section id="notesSec">
    <h2>Notizen</h2>
    <textarea id="notes" placeholder="Etwas notieren …"></textarea>
  </section>
</div>

<script>
const load=(k,d)=>{try{const v=localStorage.getItem(k);return v?JSON.parse(v):d}catch(e){return d}};
const save=(k,v)=>{try{localStorage.setItem(k,JSON.stringify(v))}catch(e){}};
const esc=s=>String(s).replace(/[&<>"]/g,c=>({"&":"&amp;","<":"&lt;",">":"&gt;",'"':"&quot;"}[c]));
const key=d=>d.getFullYear()+"-"+String(d.getMonth()+1).padStart(2,"0")+"-"+String(d.getDate()).padStart(2,"0");
const $=id=>document.getElementById(id);
const now=new Date(), today=key(now);
const COL={rot:"#c4453a",blau:"#3b6cb4",gruen:"#4a8a5a",gelb:"#d9a926"};

let todos=load("todos",[{t:"Beispiel: Zahnarzt anrufen",d:false},{t:"Beispiel: Wocheneinkauf",d:true}]);
let events=load("events",{[today]:[{h:"18:30",t:"Beispiel: Abendessen mit Freunden"}]});
let sel=today;

function tick(){const d=new Date();$("date").textContent=d.toLocaleDateString("de-DE",{weekday:"long",day:"numeric",month:"long"})+" · "+d.toLocaleTimeString("de-DE",{hour:"2-digit",minute:"2-digit"})}
tick();setInterval(tick,15000);

function renderWeek(){
  const start=new Date(now);start.setDate(now.getDate()-((now.getDay()+6)%7));
  let h="";for(let i=0;i<14;i++){const d=new Date(start);d.setDate(start.getDate()+i);const k=key(d);
    h+=`<button class="${k===today?"today ":""}${k===sel?"sel ":""}${(events[k]||[]).length?"has":""}" style="--dot:${COL[(events[k]||[])[0]?.c]||"var(--accent)"}" data-k="${k}">${i<7?`<small>${d.toLocaleDateString("de-DE",{weekday:"short"}).slice(0,2)}</small>`:""}${d.getDate()}</button>`}
  $("week").innerHTML=h;
}
function renderEvents(){
  $("selLabel").textContent=sel===today?"heute":new Date(sel+"T12:00").toLocaleDateString("de-DE",{weekday:"long",day:"numeric",month:"long"});
  const ev=(events[sel]||[]).map((x,i)=>({...x,i})).sort((a,b)=>a.h.localeCompare(b.h));
  $("eventList").innerHTML=ev.length?ev.map(x=>`<li><span class="grip" data-g="${x.i}" aria-label="Ziehen, um Termin zu verschieben">⋮⋮</span><time>${esc(x.h||"—")}</time><i class="cdot" style="background:${COL[x.c]||"var(--accent)"}"></i><span>${esc(x.t)}</span><button class="x" data-e="${x.i}" aria-label="Löschen">×</button></li>`).join(""):`<li class="empty">Keine Termine</li>`;
  save("events",events);renderWeek();
}
function renderTodos(){
  $("todoList").innerHTML=todos.length?todos.map((x,i)=>`<li class="${x.d?"done":""}"><button class="check" data-i="${i}" aria-label="${x.d?"Wieder öffnen":"Erledigt"}"></button><span>${esc(x.t)}</span><button class="x" data-del="${i}" aria-label="Löschen">×</button></li>`).join(""):`<li class="empty">Alles erledigt</li>`;
  $("todoCount").textContent=`${todos.filter(x=>!x.d).length} offen`;
  save("todos",todos);
}
$("week").addEventListener("click",e=>{const b=e.target.closest("button");if(b){sel=b.dataset.k;renderEvents()}});
$("eventList").addEventListener("click",e=>{const i=e.target.dataset.e;if(i!==undefined){events[sel].splice(+i,1);if(!events[sel].length)delete events[sel];renderEvents()}});
$("eventForm").addEventListener("submit",e=>{e.preventDefault();if($("evText").value.trim())$("pick").hidden=false;else $("evText").focus()});
$("pick").addEventListener("click",e=>{const c=e.target.dataset.c;if(!c)return;const tx=$("evText"),tm=$("evTime");
  (events[sel]=events[sel]||[]).push({h:tm.value.trim(),t:tx.value.trim(),c});tx.value="";tm.value="";showTime();$("pick").hidden=true;renderEvents()});
function showTime(){const v=$("evTime").value;$("tlabel").textContent=v?v+" Uhr":"Uhrzeit";$("tbox").classList.toggle("set",!!v)}
$("evTime").addEventListener("input",showTime);$("evTime").addEventListener("change",showTime);
$("todoList").addEventListener("click",e=>{
  if(e.target.dataset.del!==undefined){todos.splice(+e.target.dataset.del,1);renderTodos()}
  else if(e.target.dataset.i!==undefined){const x=todos[+e.target.dataset.i];x.d=!x.d;renderTodos()}
});
$("todoForm").addEventListener("submit",e=>{e.preventDefault();const i=$("todoInput");if(i.value.trim()){todos.unshift({t:i.value.trim(),d:false});i.value="";renderTodos()}});
/* Termine per Ziehen auf einen Tag verschieben (Touch + Maus) */
let drag=null;
const overDay=(x,y)=>document.elementFromPoint(x,y)?.closest(".week button");
$("eventList").addEventListener("pointerdown",e=>{const g=e.target.closest(".grip");if(!g)return;e.preventDefault();
  const ev=events[sel][+g.dataset.g];const gh=document.createElement("div");gh.className="ghost";gh.textContent=(ev.h?ev.h+"  ":"")+ev.t;document.body.append(gh);
  drag={i:+g.dataset.g,gh,over:null};moveDrag(e);try{g.setPointerCapture(e.pointerId)}catch(_){}
});
function moveDrag(e){if(!drag)return;drag.gh.style.left=e.clientX+"px";drag.gh.style.top=e.clientY+"px";const b=overDay(e.clientX,e.clientY);
  if(b!==drag.over){drag.over?.classList.remove("over");b?.classList.add("over");drag.over=b}}
function endDrag(drop){if(!drag)return;const {i,gh,over}=drag;gh.remove();over?.classList.remove("over");drag=null;
  if(drop&&over&&over.dataset.k!==sel){const k=over.dataset.k;const ev=events[sel].splice(i,1)[0];if(!events[sel].length)delete events[sel];(events[k]=events[k]||[]).push(ev);sel=k;renderEvents()}}
document.addEventListener("pointermove",moveDrag);
document.addEventListener("pointerup",()=>endDrag(true));
document.addEventListener("pointercancel",()=>endDrag(false));

const notes=$("notes");notes.value=load("notes","");notes.addEventListener("input",()=>save("notes",notes.value));
renderEvents();renderTodos();
</script>
