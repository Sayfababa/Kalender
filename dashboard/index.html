<title>Die Tageszeitung</title>
<meta name="claude:viewport-fit-sides" content="cover">
<meta name="apple-mobile-web-app-capable" content="yes">
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=UnifrakturMaguntia&family=Old+Standard+TT:ital,wght@0,400;0,700;1,400&family=Source+Serif+4:opsz,wght@8..60,400;8..60,600&display=swap">
<style>
/* Layout: ein Bildschirm – Masthead, Wochenleiste, Termine, Aufgaben; Listen scrollen innen, die Seite nie */
:root{
  --paper:#f7f5ef; --ink:#151412; --ink-soft:#5a564d; --rule:#1c1b18; --faint:#d9d5c9; --red:#8f1d16;
  --display:"UnifrakturMaguntia","Old English Text MT",serif;
  --head:"Old Standard TT",Georgia,serif;
  --body:"Source Serif 4",Georgia,serif;
  color-scheme:light;
}
@media (prefers-color-scheme: dark){:root:not([data-theme="light"]){--paper:#1a1916;--ink:#ece8dd;--ink-soft:#a8a397;--rule:#ece8dd;--faint:#3a3832;--red:#e0796f;color-scheme:dark}}
:root[data-theme="dark"]{--paper:#1a1916;--ink:#ece8dd;--ink-soft:#a8a397;--rule:#ece8dd;--faint:#3a3832;--red:#e0796f;color-scheme:dark}
html,body{height:100%}
body{background:var(--paper);color:var(--ink);font-family:var(--body);font-size:16px;line-height:1.4;box-sizing:border-box;overflow:hidden;
  padding-left:max(16px,env(safe-area-inset-left,0px));padding-right:max(16px,env(safe-area-inset-right,0px));padding-block:10px 12px}
.page{height:100%;max-width:560px;margin:0 auto;display:flex;flex-direction:column;gap:10px}
header{text-align:center;flex:none}
h1{font-family:var(--display);font-weight:400;font-size:clamp(34px,10vw,52px);line-height:1;margin:0 0 6px}
.dateline{display:flex;justify-content:space-between;gap:6px;border-top:1px solid var(--rule);border-bottom:3px double var(--rule);
  padding:4px 0;font:11px var(--head);text-transform:uppercase;letter-spacing:.08em;font-variant-numeric:tabular-nums}
.kicker{display:flex;justify-content:space-between;align-items:baseline;font:700 11px var(--head);text-transform:uppercase;letter-spacing:.14em;color:var(--red);margin:0 0 4px}
.kicker span{color:var(--ink-soft);letter-spacing:.05em;font-weight:400;text-transform:none;font-style:italic;font-size:13px}
.week{display:grid;grid-template-columns:repeat(7,1fr);text-align:center;flex:none}
.week button{background:none;border:0;color:var(--ink);padding:4px 0;cursor:pointer;font:15px var(--body);font-variant-numeric:tabular-nums;position:relative}
.week button small{display:block;font:700 10px var(--head);text-transform:uppercase;letter-spacing:.06em;color:var(--ink-soft)}
.week button.today{text-decoration:underline;text-underline-offset:3px;font-weight:600}
.week button.sel{background:var(--ink);color:var(--paper)}
.week button.sel small{color:var(--paper)}
.week button.has::after{content:"";position:absolute;left:50%;bottom:1px;width:4px;height:4px;margin-left:-2px;border-radius:50%;background:var(--red)}
section{display:flex;flex-direction:column;min-height:0;border-top:1px solid var(--rule);padding-top:6px}
#cal{flex:0 1 auto;max-height:36%}
#tasks{flex:1 1 auto}
ul{list-style:none;margin:0;padding:0;overflow-y:auto;min-height:0;flex:1 1 auto}
li{display:flex;align-items:baseline;gap:10px;padding:6px 0;border-bottom:1px dotted var(--faint)}
li span{flex:1;min-width:0;overflow-wrap:anywhere}
li time{font:700 13px var(--head);min-width:40px;font-variant-numeric:tabular-nums}
li.done span{text-decoration:line-through;color:var(--ink-soft)}
li input{accent-color:var(--ink);width:18px;height:18px;flex:none;transform:translateY(3px)}
.empty{font-style:italic;color:var(--ink-soft)}
form{display:flex;gap:8px;flex:none;margin-top:6px}
input[type=text]{flex:1;min-width:0;font:16px var(--body);color:var(--ink);background:transparent;border:0;border-bottom:1px solid var(--ink-soft);padding:5px 2px}
input:focus-visible,button:focus-visible{outline:2px solid var(--red);outline-offset:2px}
form button{font:700 12px var(--head);text-transform:uppercase;letter-spacing:.1em;background:var(--ink);color:var(--paper);border:0;padding:6px 12px;cursor:pointer}
.x{background:none;border:0;color:var(--ink-soft);font-size:18px;padding:0 4px;cursor:pointer}
</style>

<div class="page">
  <header>
    <h1>Die Tageszeitung</h1>
    <div class="dateline"><span id="longdate"></span><span id="clock"></span></div>
  </header>

  <div class="week" id="week"></div>

  <section id="cal">
    <p class="kicker">Termine <span id="selLabel"></span></p>
    <ul id="eventList"></ul>
    <form id="eventForm"><input type="text" id="evTime" placeholder="09:00" style="flex:0 0 58px" inputmode="numeric"><input type="text" id="evText" placeholder="Neuer Termin …" autocomplete="off"><button>+</button></form>
  </section>

  <section id="tasks">
    <p class="kicker">Aufgaben <span id="todoCount"></span></p>
    <ul id="todoList"></ul>
    <form id="todoForm"><input type="text" id="todoInput" placeholder="Neue Aufgabe …" autocomplete="off"><button>+</button></form>
  </section>
</div>

<script>
const load=(k,d)=>{try{const v=localStorage.getItem(k);return v?JSON.parse(v):d}catch(e){return d}};
const save=(k,v)=>{try{localStorage.setItem(k,JSON.stringify(v))}catch(e){}};
const esc=s=>String(s).replace(/[&<>"]/g,c=>({"&":"&amp;","<":"&lt;",">":"&gt;",'"':"&quot;"}[c]));
const key=d=>d.getFullYear()+"-"+String(d.getMonth()+1).padStart(2,"0")+"-"+String(d.getDate()).padStart(2,"0");
const $=id=>document.getElementById(id);
const now=new Date(), today=key(now);

let todos=load("todos",[{t:"Beispiel: Zahnarzt anrufen",d:false},{t:"Beispiel: Wocheneinkauf",d:true}]);
let events=load("events",{[today]:[{h:"18:30",t:"Beispiel: Abendessen mit Freunden"}]});
let sel=today;

function tick(){$("clock").textContent=new Date().toLocaleTimeString("de-DE",{hour:"2-digit",minute:"2-digit"})}
tick();setInterval(tick,15000);
$("longdate").textContent=now.toLocaleDateString("de-DE",{weekday:"long",day:"numeric",month:"long"});

function renderWeek(){
  const start=new Date(now);start.setDate(now.getDate()-((now.getDay()+6)%7));
  let h="";for(let i=0;i<7;i++){const d=new Date(start);d.setDate(start.getDate()+i);const k=key(d);
    h+=`<button class="${k===today?"today ":""}${k===sel?"sel ":""}${(events[k]||[]).length?"has":""}" data-k="${k}"><small>${d.toLocaleDateString("de-DE",{weekday:"short"}).slice(0,2)}</small>${d.getDate()}</button>`}
  $("week").innerHTML=h;
}
function renderEvents(){
  $("selLabel").textContent=sel===today?"heute":new Date(sel+"T12:00").toLocaleDateString("de-DE",{weekday:"long",day:"numeric",month:"long"});
  const ev=(events[sel]||[]).map((x,i)=>({...x,i})).sort((a,b)=>a.h.localeCompare(b.h));
  $("eventList").innerHTML=ev.length?ev.map(x=>`<li><time>${esc(x.h||"—")}</time><span>${esc(x.t)}</span><button class="x" data-e="${x.i}" aria-label="Löschen">×</button></li>`).join(""):`<li class="empty">Keine Termine.</li>`;
  save("events",events);renderWeek();
}
function renderTodos(){
  $("todoList").innerHTML=todos.length?todos.map((x,i)=>`<li class="${x.d?"done":""}"><input type="checkbox" id="td${i}" ${x.d?"checked":""} data-i="${i}"><span>${esc(x.t)}</span><button class="x" data-del="${i}" aria-label="Löschen">×</button></li>`).join(""):`<li class="empty">Alles erledigt.</li>`;
  const open=todos.filter(x=>!x.d).length;$("todoCount").textContent=`${open} offen`;
  save("todos",todos);
}
$("week").addEventListener("click",e=>{const b=e.target.closest("button");if(b){sel=b.dataset.k;renderEvents()}});
$("eventList").addEventListener("click",e=>{const i=e.target.dataset.e;if(i!==undefined){events[sel].splice(+i,1);if(!events[sel].length)delete events[sel];renderEvents()}});
$("eventForm").addEventListener("submit",e=>{e.preventDefault();const tx=$("evText"),tm=$("evTime");if(tx.value.trim()){(events[sel]=events[sel]||[]).push({h:tm.value.trim(),t:tx.value.trim()});tx.value="";tm.value="";renderEvents()}});
$("todoList").addEventListener("click",e=>{
  if(e.target.dataset.del!==undefined){todos.splice(+e.target.dataset.del,1);renderTodos()}
  else if(e.target.dataset.i!==undefined){todos[+e.target.dataset.i].d=e.target.checked;renderTodos()}
});
$("todoForm").addEventListener("submit",e=>{e.preventDefault();const i=$("todoInput");if(i.value.trim()){todos.unshift({t:i.value.trim(),d:false});i.value="";renderTodos()}});
renderEvents();renderTodos();
</script>
